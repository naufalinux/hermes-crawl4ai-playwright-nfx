name: hermes-crawl4ai-playwright-nfx
version: 0.2.0
requires_hermes: ">=0.23.1"
homepage: https://github.com/naufalinux/hermes-crawl4ai-playwright-nfx
description: "Crawl4AI web-extract backend and bounded crawl tool for Hermes, with an opt-in Firecrawl fallback for anti-bot blocks. Pair with SearXNG for search. Requires CRAWL4AI_URL and CRAWL4AI_API_TOKEN."
author: Naufalinux
license: GPL-3.0-only
kind: backend
provides_web_providers:
  - crawl4ai
provides_tools:
  - crawl4ai_crawl
optional_env:
  - name: CRAWL4AI_URL
    description: "Base URL of your Crawl4AI server (http/https, no credentials)"
  - name: CRAWL4AI_API_TOKEN
    description: "Bearer token your Crawl4AI server requires"
    secret: true
  - name: CRAWL4AI_FILTER
    description: "Markdown filter: fit (default) or raw"
  - name: CRAWL4AI_TIMEOUT
    description: "Seconds per URL, 5-300 (default 60)"
  - name: CRAWL4AI_MAX_CHARS
    description: "Truncate each page to N characters (2000-200000; 0 or unset = no truncation)"
  - name: CRAWL4AI_CRAWL_TIMEOUT
    description: "Deadline in seconds for one crawl4ai_crawl call, 30-300 (default 180)"
  - name: CRAWL4AI_FALLBACK
    description: "Set to 'firecrawl' to retry anti-bot-blocked public URLs on Firecrawl Cloud (off by default; sends the URL to a third party)"
  - name: FIRECRAWL_API_KEY
    description: "Firecrawl API key, used only by the opt-in fallback"
    secret: true
  - name: CRAWL4AI_FALLBACK_MAX_PER_CALL
    description: "Max fallback fetches per extract call (default 3)"
  - name: CRAWL4AI_FALLBACK_MAX_PER_DAY
    description: "Max fallback fetches per process per day (default 20; resets on restart)"
  - name: CRAWL4AI_FALLBACK_DENY_DOMAINS
    description: "Comma-separated domains that are never sent to the fallback"
